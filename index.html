<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RetroRockets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="gate">
      <img src="content/Menu/Images/logo.png" alt="RetroRockets" />
      <p>Click, press a key, or press A on a controller to start</p>
      <p class="hint">Xbox pad: triggers thrust, A confirm, B back, Start pause<br />Keyboard: Q / E thrust, arrows move, Enter confirm, Esc back, P pause</p>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
